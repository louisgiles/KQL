name: KQL validation gate

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static:
    name: Parse and lint every .kql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint runtime and execution-surface hazards
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          MERGE_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
          PUSH_BASE_SHA: "${{ github.event.before }}"
        run: |
          case "$EVENT_NAME" in
            pull_request)
              python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}" --base "$PR_BASE_SHA"
              ;;
            merge_group)
              python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}" --base "$MERGE_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}" --all
              else
                python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}" --base "$PUSH_BASE_SHA"
              fi
              ;;
            workflow_dispatch)
              python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}" --all
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore + build
        run: dotnet build tests/kql-smoke --configuration Release --nologo

      - name: Run harness
        run: dotnet run --project tests/kql-smoke --configuration Release --no-build --no-restore -- "${{ github.workspace }}"

  live-validation:
    name: KQL / live validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce exact-content Sentinel receipt
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          MERGE_BASE_SHA: "${{ github.event.merge_group.base_sha }}"
          PUSH_BASE_SHA: "${{ github.event.before }}"
        run: |
          case "$EVENT_NAME" in
            pull_request)
              python3 scripts/check-sentinel-live-validation.py "${{ github.workspace }}" --base "$PR_BASE_SHA"
              ;;
            merge_group)
              python3 scripts/check-sentinel-live-validation.py "${{ github.workspace }}" --base "$MERGE_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                python3 scripts/check-sentinel-live-validation.py "${{ github.workspace }}" --all
              else
                python3 scripts/check-sentinel-live-validation.py "${{ github.workspace }}" --base "$PUSH_BASE_SHA"
              fi
              ;;
            workflow_dispatch)
              python3 scripts/check-sentinel-live-validation.py "${{ github.workspace }}" --all
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
