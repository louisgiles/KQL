name: KQL smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    name: Parse and lint every .kql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint runtime-sensitive literals
        run: python3 scripts/lint-kql-runtime-literals.py "${{ github.workspace }}"

      - name: Enforce exact-source investigation approvals
        run: python3 scripts/check-investigation-approvals.py "${{ github.workspace }}"

      - name: Test investigation approval gate
        run: python3 tests/test_investigation_approval_gate.py

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore + build
        run: dotnet build tests/kql-smoke --configuration Release --nologo

      - name: Run harness
        run: dotnet run --project tests/kql-smoke --configuration Release --no-build --no-restore -- "${{ github.workspace }}"
