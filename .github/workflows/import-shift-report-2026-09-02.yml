name: Import Shift Browser research report

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-shift-report-2026-09-02.yml

permissions:
  contents: write

jobs:
  import-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit report
        env:
          REPORT_PART_1: 
          REPORT_PART_2: 
        run: |
          mkdir -p threat-work/research/2026
          printf %s%s "$REPORT_PART_1" "$REPORT_PART_2" | base64 --decode | xz --decompress > threat-work/research/2026/2026-09-02-shift-browser-security-assessment.md
          actual=$(sha256sum threat-work/research/2026/2026-09-02-shift-browser-security-assessment.md | cut -d ' ' -f 1)
          test "$actual" = '2e3bfa916f3713218887ca61d3f0d3154b686532069c2010427880e2d12ec54d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add threat-work/research/2026/2026-09-02-shift-browser-security-assessment.md
          git commit -m 'docs(research): add Shift Browser security assessment'
          git push
